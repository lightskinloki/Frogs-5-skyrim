<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gaelen Conversation Director</title><style>
:root{--bg:#0d1117;--card:#161b22;--line:#30363d;--text:#e6edf3;--muted:#8b949e;--gold:#d29922;--red:#f85149;--green:#3fb950;--blue:#58a6ff;--violet:#bc8cff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,Segoe UI,sans-serif}
header{position:sticky;top:0;z-index:5;background:#0d1117f2;border-bottom:1px solid var(--line);padding:.55rem 1rem;display:flex;gap:.8rem;align-items:center;flex-wrap:wrap}
header h1{font:700 1.05rem Georgia,serif;margin:0;color:var(--gold)}.pill{border:1px solid var(--line);border-radius:999px;padding:.12rem .6rem;font-size:.8rem;color:var(--muted)}
header button{background:#21262d;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:.3rem .7rem;cursor:pointer}
header button.home{border-color:var(--gold);color:var(--gold);font-weight:700}
.must{background:#3b1a1a;border-left:4px solid var(--red);padding:.5rem 1rem;font-size:.9rem}
.wrap{display:grid;grid-template-columns:minmax(300px,430px) 1fr;gap:1rem;padding:1rem}@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.map h2{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:1rem 0 .4rem}
.flow{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center;font-size:.78rem;color:var(--muted)}.flow b{color:var(--text);border:1px solid var(--line);border-radius:5px;padding:.12rem .4rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.35rem}
.node{text-align:left;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:.45rem .55rem;cursor:pointer;font-size:.82rem}
.node:hover{border-color:var(--gold)}.node.current{border-color:var(--gold);box-shadow:0 0 0 2px #d2992266}
.node.visited{background:#12261a;border-color:#2ea04388}.node .ct{display:block;font-size:.7rem;color:var(--muted)}.node.visited .ct{color:var(--green)}
.node.hub{grid-column:1/-1;border-color:var(--gold);font-weight:700;text-align:center;font-size:.95rem}
.g-exit .node{border-color:#f8514988}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1rem 1.2rem;align-self:start}
.panel h2{font:700 1.3rem Georgia,serif;margin:.1rem 0 .3rem}.intent{color:var(--muted);font-style:italic}
.sec{margin-top:.9rem}.sec h3{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin:0 0 .3rem}
.anchor{border-left:3px solid var(--violet);padding:.35rem .7rem;margin:.35rem 0;font-family:Georgia,serif;font-style:italic;color:#e2d9ff}
.anchor.draft{border-left-color:#6e7681;color:#c9d1d9}.anchor .src{display:block;font:normal .7rem system-ui;color:var(--muted);margin-top:.15rem}
.tag{font:700 .65rem system-ui;letter-spacing:.06em;padding:.05rem .35rem;border-radius:4px;margin-right:.35rem;font-style:normal}.tag.s{background:#1f6feb44;color:var(--blue)}.tag.d{background:#6e768144;color:#c9d1d9}
.mustbox{border-left:4px solid var(--red);background:#3b1a1a77;padding:.5rem .8rem;margin:.3rem 0}
ul{margin:.2rem 0;padding-left:1.2rem}li{margin:.2rem 0}
.reply{border:1px solid var(--line);border-radius:7px;padding:.45rem .7rem;margin:.35rem 0}.reply b{color:var(--blue)}
.check{display:flex;gap:.45rem;align-items:flex-start;margin:.25rem 0;cursor:pointer}.check input{margin-top:.3rem}.check.done span{color:var(--green);text-decoration:line-through}
.nextbtns{display:flex;flex-wrap:wrap;gap:.35rem}.nextbtns button,.beat{background:#21262d;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:.4rem .7rem;cursor:pointer;font-size:.85rem}
.nextbtns button:hover,.beat:hover{border-color:var(--gold)}.nextbtns .home{border-color:var(--gold);color:var(--gold);font-weight:700}
.beat{display:block;width:100%;text-align:left;margin:.25rem 0}.beat.used{opacity:.45;text-decoration:line-through}
textarea{width:100%;background:#0d1117;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:.5rem;min-height:3rem;font:inherit}
.const{font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);margin-top:1rem;padding-top:.6rem}
</style></head><body>
<header><h1>Gaelen &mdash; Conversation Director</h1><span class="pill" id="covered"></span><span class="pill" id="beats"></span>
<button class="home" onclick="go('hub')">&#8962; What did they do?</button>
<button onclick="if(confirm('Reset coverage for a new run?')){try{localStorage.removeItem(KEY)}catch(e){};location.reload()}">Reset</button></header>
<div class="must"><b>MUST-SAY (only three):</b> (1) the welcome read-aloud &middot; (2) the Quiet Wish mid-fight: <i>"I want it to be perfect. Please... let it be perfect."</i> &middot; (3) the escape read-aloud at 3 anchors down. <b>Everything else: your own words.</b> Gaelen never lies, never fights, never threatens.</div>
<div class="wrap"><nav class="map" id="map"></nav><main class="panel" id="panel"></main></div>
<script>
const NODES = {"welcome": {"g": "start", "title": "Welcome (read-aloud)", "intent": "The party opens the bronze doors and enters.", "aim": "Invite them in. He is glad they came.", "must": ["Read the undercroft description and his welcome from the runsheet exactly: \"Oh -- visitors. Good. I hoped the mountain would manage to be heard. Come in, come in. You are not interrupting; nothing can interrupt this. But company is rare, and I have wanted to meet you for the longest time.\""], "info": ["Then STOP. Ask the table: \"What do you do?\" Do not start a second speech.", "If someone can read Daedric: the floor script repeats \"THE TOWER TOUCHES ALL THE MANTLES OF HEAVEN\" (module 1909)."], "perf": ["He does not turn around at first. He keeps turning the shard.", "Jasper and the other Dawn members are visible at the stations, calm and working."], "points": ["Welcome read", "Asked \"What do you do?\""], "next": ["hub"]}, "hub": {"g": "start", "title": "WHAT DID THE PLAYERS DO?", "intent": "The center of the chart. Every node returns here.", "aim": "Pick the node closest to what the player just said or did.", "info": ["Loop: player acts -> open the closest node -> answer in your own words from it -> one ritual beat -> back here.", "Gaelen answers the person who spoke, one person at a time. He does not run through the party in order."], "points": [], "next": ["question", "accuse", "moral", "rightworld", "trust", "abandon", "aedra", "jasper", "personal", "silence", "ritual", "attack", "agree", "refuse", "combat"]}, "question": {"g": "talk", "title": "Asks for information (who / what / why)", "intent": "\"Who are you?\" \"What are you doing?\" \"What do you want?\"", "aim": "Answer plainly and honestly. He wants them to understand before they decide.", "anchors": [{"t": "You're fighting three apocalypses at once. You know that, yes? Dragons, plagues, and the slow death of every root in the ground. And you're losing. Not because you're weak -- you are extraordinary. You're losing because the system you are defending was built to break.", "src": "SOURCE", "ref": "Gaelen sheet, opening quote"}, {"t": "I am not offering you power. I am offering you the chance to stop maintaining a machine that was designed to grind you down. That is all this is.", "src": "SOURCE", "ref": "Gaelen sheet, opening quote"}, {"t": "You're exhausted. I can see it in the way you carry your weapons.", "src": "SOURCE", "ref": "Gaelen sheet, source monologue"}], "info": ["He is corrupting the Tower -- the Throat's root, one of the pillars holding the world up.", "Five volcanic-glass anchors pin the wound open; three of them hold the tension (Jasper's journal).", "The time distortion on the mountain is a side effect, not his goal (Gaelen sheet, re-staging note).", "His aim: release the world from Aedric physics -- linear time, fragile flesh (source monologue).", "He answers honestly if asked. He will not lie about what the ritual does."], "replies": [{"say": "What happens to Skyrim if you finish?", "ans": "The fixed laws loosen: time, flesh, death stop being a cage. He does not claim it is painless."}, {"say": "Why do you want to meet us?", "ans": "Because they are living proof of what he describes: bled across the province holding a broken world together."}, {"say": "What happened to your arm?", "ans": "SOURCE: \"People ask what happened to my hand. Nothing happened to my hand. Something happened to my understanding of what a hand is for.\""}, {"say": "Can we stop you?", "ans": "True answer: three anchors. He does not hide it -- the journal already told them."}], "room": "One Dawn member keeps working the nearest anchor. Esbern watches Gaelen's hands.", "points": ["Named the three apocalypses", "'Stop maintaining the machine'", "Explained the Tower/anchors", "Answered a follow-up honestly"], "next": ["moral", "rightworld", "jasper", "ritual", "personal"]}, "accuse": {"g": "talk", "title": "Condemns his allegiance (Dawn / Dagon)", "intent": "\"You're Mythic Dawn.\" \"You serve Dagon.\"", "aim": "Admit it plainly. Ask them to judge what he says and does, not the name.", "anchors": [{"t": "I don't want to destroy you. Dagon is not a destroyer. He is just the one offering us the key.", "src": "SOURCE", "ref": "Gaelen sheet, source monologue"}, {"t": "Yes. I serve Dagon.", "src": "DRAFT", "ref": ""}], "info": ["He is openly Dawn. He does not deny the order's history.", "Gaelen and the Dawn are telling the truth; there is no hidden trick for the party to expose."], "replies": [{"say": "The Mythic Dawn murdered an emperor / opened Oblivion.", "ans": "He does not deny it. He asks whether that history answers anything he has said about this mountain."}, {"say": "Dagon is the Prince of Destruction.", "ans": "SOURCE: \"Dagon is not a destroyer. He is just the one offering us the key.\""}], "room": "Esbern recognizes the ancient enemy of the Blades and hardens. He will not waver.", "points": ["Admitted the Dawn openly", "'Dagon offers the key'", "Turned it back to what he actually said"], "next": ["esbern", "moral", "trust", "refuse"]}, "moral": {"g": "talk", "title": "Objects to the cost or harm", "intent": "They say the cure is worse than the disease.", "aim": "Concede that the cost is real. Show them the cost of the world as it is.", "anchors": [{"t": "The Aedra didn't give us life. They gave us physics. They trapped this realm in linear time and fragile flesh, and they convinced us to worship the very laws that keep us small and dying.", "src": "SOURCE", "ref": "source monologue"}, {"t": "Every time you cast a healing spell, every time you strike down one of Dagon's children, you aren't saving the world. You are just tightening the locks on your own cell.", "src": "SOURCE", "ref": "source monologue"}, {"t": "You're right that it will cost something. I've counted it. So has everyone working here.", "src": "DRAFT", "ref": ""}], "info": ["He does not pretend the Unmaking is harmless.", "He believes the present world is already an engine of suffering.", "Mirror (your words, 9/26): Gaelen and the Dawn are dangerous because they are the same thing as the Lanterns."], "replies": [{"say": "People won't be themselves / we'd forget each other.", "ans": "He cannot promise memory or separate selves survive, and he will not lie that they do. This is the argument that actually lands on him -- let it land."}, {"say": "You're choosing for everyone.", "ans": "So do the Lanterns, every time they save Skyrim for people who never asked. He says so plainly, without scorn."}], "room": "Bjorn moves a step closer to Mila.", "points": ["Conceded the cost is real", "'Physics, not life'", "'Tightening the locks'", "Mirror: 'you choose for everyone too'"], "next": ["rightworld", "personal", "agree", "refuse"]}, "rightworld": {"g": "talk", "title": "Agrees with the problem, rejects the fix", "intent": "They agree with his diagnosis and reject his cure.", "aim": "Give the true point its due. Ask what they would do instead.", "anchors": [{"t": "What if the whole forest is trying to heal, and you keep telling it to stay still?", "src": "SOURCE", "ref": "sheet, to Saijah -- works for anyone"}, {"t": "Then tell me your fix. I'll listen.", "src": "DRAFT", "ref": ""}], "info": ["He is genuinely interested in a better answer. He has not found one.", "His conclusion came from evidence: his clan starved under the Green Pact rather than harm a plant (backstory)."], "replies": [{"say": "Fix it without ending it -- heal the roots, save the nodes.", "ans": "He asks how long they can keep patching. Every victory preserves the same machine."}], "room": "Jasper looks up from his anchor. He was where they are once.", "points": ["Conceded they're right about the world", "Asked for their alternative", "Told the Green Pact famine"], "next": ["moral", "personal", "agree", "refuse"]}, "trust": {"g": "talk", "title": "Doubts his honesty or motives", "intent": "They doubt his honesty.", "aim": "He doesn't ask them to trust the name. He points to what he has shown them and to Jasper.", "anchors": [{"t": "I took a knife to my own true name to cut away those limits. I removed the parts of my soul that kept me static. The surgery changed me. What is left behind is not what I was. But it is free.", "src": "SOURCE", "ref": "source monologue"}, {"t": "Ask Jasper what happened to him.", "src": "DRAFT", "ref": ""}], "info": ["He has not lied to them and will not.", "Jasper is living evidence: the Dawn really rescued him in Winterhold."], "replies": [{"say": "Then show us.", "ans": "He lifts the graft arm -- not a threat, evidence (monologue stage direction)."}], "room": "Turn attention to Jasper. His player can answer.", "points": ["Told of cutting his own true name", "Pointed to Jasper"], "next": ["jasper", "moral", "refuse"]}, "abandon": {"g": "talk", "title": "Appeals to duty / people who need them", "intent": "They say people depend on the Lanterns.", "aim": "He says the opposite: put down a weight they were never meant to carry.", "anchors": [{"t": "You have suffered enough for a stolen, stagnant realm that demands your constant sacrifice just to remain exactly as it is. You don't have to carry this burden anymore.", "src": "SOURCE", "ref": "source monologue"}, {"t": "Please. Put down your weapons. Let the Unmaking heal us.", "src": "SOURCE", "ref": "source monologue -- 'Please' is the most important word"}], "info": ["'Please' is how his altered architecture says something matters beyond logic (sheet GM note)."], "replies": [{"say": "We protect people. That's who we are.", "ans": "He asks who protects them. Who asked them to bleed for this."}], "room": "Varon's hand goes to the scar behind his ear.", "points": ["'You don't have to carry this anymore'", "Said 'Please'"], "next": ["personal", "agree", "refuse"]}, "aedra": {"g": "talk", "title": "Defends the gods / the existing order", "intent": "They defend the gods.", "aim": "He agrees the Aedra aren't cruel. He doesn't hate them. He sees their order as a cage.", "anchors": [{"t": "You see a tree that has stood unchanging for a thousand years and you call it sacred. You call it nature. I look at it and I see a prisoner. We all are.", "src": "SOURCE", "ref": "source monologue"}, {"t": "I don't hate them.", "src": "DRAFT", "ref": ""}], "info": ["He does not hate stasis -- hatred needs wiring he no longer has. He sees it as a problem and proceeds to solve it (sheet).", "To him true nature is mutable; a tree that holds one shape a thousand years is 'arrested mid-sentence'."], "replies": [{"say": "Kynareth / Arkay answered me.", "ans": "He is glad for them. Jasper prayed to Arkay for three days and nobody answered."}], "room": "Saijah's migraine pulses near the root.", "points": ["'Not hatred -- a cage'", "Unchanging tree = prisoner"], "next": ["saijah", "jasper", "moral"]}, "jasper": {"g": "talk", "title": "Engages Jasper", "intent": "Someone recognizes Jasper, asks about him, or speaks to him.", "aim": "Tell the truth: the Dawn rescued Jasper, and Jasper gave himself to it. Gaelen does not own him.", "must": ["Give the recognition to Davinia/Ismara's player FIRST (module 1937). What she does with it is hers."], "anchors": [{"t": "He made his choice after the Dawn found him. You'd have to ask him why.", "src": "DRAFT", "ref": ""}, {"t": "He was freezing in a snow-drift in Winterhold, and the Dawn found him.", "src": "DRAFT", "ref": ""}], "info": ["They left him in the Pale Lady's crypt thinking he was dead. Three days crawling, praying to Arkay, nobody answered (journal).", "The Dawn pulled him from a snow-drift in Winterhold. He WAS rescued -- literally true, not just his belief.", "He gave himself to the DAWN, not to Gaelen. Gaelen interprets the Dawn; he doesn't own anyone (your words).", "Do NOT use the module's 'secret Dagon devotee in life' or 'he is gone / vessel' line -- both retired."], "replies": [{"say": "Come home with us.", "ans": "Jasper's player answers. There is nothing to rescue him from."}, {"say": "Were you forced?", "ans": "No. Gaelen says so; Jasper says so."}], "room": "Jasper is the guest player. Let them speak. Dawn members keep working.", "points": ["Davinia/Ismara got the recognition first", "Winterhold rescue told", "'He chose the Dawn, not me'"], "next": ["trust", "moral", "combat"]}, "personal": {"g": "talk", "title": "Makes it personal (pick the person)", "intent": "A player raised their own wound, or Gaelen addresses the person who just spoke.", "aim": "Speak to the wound the player put in the room. Not a speech about the character.", "info": ["He speaks to one person at a time, closely, like asking for a private word."], "points": [], "next": ["saijah", "davinia", "alfonso", "orion", "gear", "varon", "ylva", "bjorn", "mila", "esbern"]}, "silence": {"g": "talk", "title": "Hesitates / says nothing", "intent": "Nobody answers. The table stalls.", "aim": "Let the silence sit. Then speak to one visible person, not the room.", "anchors": [{"t": "Take your time. I'll wait for you.", "src": "DRAFT", "ref": ""}], "info": ["Do one ritual beat. Then open the node of whoever looks most affected."], "room": "Pick one ritual beat.", "points": ["Let silence sit", "Addressed one person"], "next": ["ritual", "personal"]}, "ritual": {"g": "talk", "title": "Examines the ritual", "intent": "They study the anchors, root, sap.", "aim": "Show only what their action reveals. The work never pauses for conversation.", "info": ["Five waist-high obsidian anchors, 300 HP / DR 10 each. Three destroyed disrupts the working.", "Orion's counter-note: Hard Magic (-4), 100 damage to one anchor, ignores DR.", "Hidden alarm ~6 min (Zone 3). When it fires, describe a bigger change.", "Touching an anchor or stepping into the spiral STARTS COMBAT."], "points": [], "next": ["combat"]}, "attack": {"g": "exit", "title": "Attacks Gaelen himself", "intent": "Someone hits Gaelen.", "aim": "He does not retaliate or defend himself. He keeps talking.", "info": ["This alone does NOT start combat. Combat starts when the ritual, Jasper, or a Dawn member is threatened, or they refuse and move to stop it.", "The Dawn members do not throw themselves in front of him -- he never asked them to."], "room": "He looks at the attacker only to answer them.", "points": ["Took the blow without retaliating"], "next": ["hub", "combat"]}, "agree": {"g": "exit", "title": "Sides with him", "intent": "A player sides with Gaelen.", "aim": "No trick. He meant every word.", "info": ["Ask: what does your character physically do? Stand aside? Help? Negotiate limits?", "Resolve each NPC on camera: Esbern resists. Bjorn protects Mila. GEAR may go to the work. Varon may choose relief."], "points": ["Asked what they physically do", "Resolved each NPC"], "next": ["esbern", "gear", "varon", "bjorn", "combat"]}, "refuse": {"g": "exit", "title": "Refuses and moves to stop him", "intent": "\"No.\" and they move.", "aim": "He accepts it without anger or pleading, and returns to the work.", "anchors": [{"t": "All right. I'm sorry.", "src": "DRAFT", "ref": ""}], "info": ["Jasper engages. Start initiative even if no anchor has been struck."], "points": ["Accepted refusal calmly"], "next": ["combat"]}, "combat": {"g": "exit", "title": "Moves against the ritual = COMBAT", "intent": "Anchor attacked/touched, spiral entered, Jasper or a Dawn member attacked, or refusal + movement.", "aim": "Gaelen keeps working and talking. He never attacks.", "must": ["QUIET WISH, mid-fight, overheard by whoever is nearest him, said to no one: \"I want it to be perfect. Please... let it be perfect.\"", "At THREE anchors down, read the escape in the runsheet exactly: \"The third anchor cracks and the whole undercroft LURCHES...\" / \"Hm. Unfinished, then... You finally showed up. Do you know, I had begun to think no one was coming, all these years. How wonderful. Something new.\""], "info": ["Jasper (guest player) goes for a TPK; the Dawn members fight with him (you run them).", "Use the runsheet's combat manager for anchors and Tempo.", "Gaelen answers anyone who talks to him mid-fight."], "points": ["Quiet Wish delivered", "Escape read"], "next": ["hub"]}, "saijah": {"g": "person", "title": "Saijah", "intent": "Pain, Kynareth, the migraine, the skooma crash.", "aim": "Speak to the burden she carries. Don't mock Kynareth.", "anchors": [{"t": "You feel the roots dying. I know -- I can see it in the way you hold your head, the way you wince when you face southeast. You think the Green is asking you to save it. What if it is asking you to let it change? You are a healer. You know what healing does. It does not preserve -- it replaces. What if the whole forest is trying to heal, and you keep telling it to stay still?", "src": "SOURCE", "ref": "Gaelen sheet, key dialogue"}], "info": ["She refused Hircine's offer of silence in Ch.30. He can ask why she chooses the pain.", "Saijah senses first that he is alive, sincere, and 'not like her' (sheet)."], "room": "Varon watches her. Probably only she can stop him from defecting.", "points": ["Healing/replace argument", "Named the migraine"], "next": ["varon", "hub"]}, "davinia": {"g": "person", "title": "Davinia / Ismara", "intent": "The crown, the shared body, what was given up.", "aim": "Speak to the cost of carrying power. Address whoever is driving (Ismara unless Davinia surfaces).", "anchors": [{"t": "You traded your breathing for power. Every inhale is an act of will now. You already understand that the natural state was a limitation. You have just not followed that understanding all the way to its end yet.", "src": "SOURCE", "ref": "Gaelen sheet, key dialogue (to Davinia)"}], "info": ["He speaks to what is visible, not every private detail. He asks when unsure."], "points": ["Breathing line"], "next": ["jasper", "hub"]}, "alfonso": {"g": "person", "title": "Alfonso", "intent": "The soul outside the body.", "aim": "Recognize the choice without claiming they're the same. Give his player the floor.", "anchors": [{"t": "You moved your soul into a sword. You stepped outside the body the Aedra gave you and you kept going. We are not so different. You did it to survive. I did it because surviving was not sufficient.", "src": "SOURCE", "ref": "Gaelen sheet, key dialogue"}], "info": ["Alfonso walks in his obsidian body now.", "Whatever Alfonso answers, however long it takes, is his (module)."], "room": "Ylva watches Alfonso's answer.", "points": ["'Not so different'"], "next": ["ylva", "hub"]}, "orion": {"g": "person", "title": "Orion", "intent": "The Ring, Valerius, the Brotherhood, Molag Bal.", "aim": "Offer a world where those tethers lose their anchor. No new master.", "anchors": [{"t": "How many people have a claim on you right now? When this is finished, none of them will.", "src": "DRAFT", "ref": ""}], "info": ["Gaelen can smell the Molag Bal taint (sheet).", "He does not threaten to remove the Ring. Orion decides.", "Nora may notice the danger in what he says."], "points": ["Named the claims on him"], "next": ["hub"]}, "gear": {"g": "person", "title": "GEAR", "intent": "The Dwemer disappearance -- your approved angle.", "aim": "Ismara already gave GEAR purpose, so Gaelen does not offer purpose. He asks questions.", "anchors": [{"t": "What did your makers find, at the end? What do you think happened to them?", "src": "DRAFT", "ref": ""}, {"t": "You're the part that stayed. What do you make of that?", "src": "DRAFT", "ref": ""}], "info": ["GEAR is the fragment that remained after the Dwemer vanished; he treats his continued existence as an unresolved error.", "The offer: the Dawn may be the first experiment that can answer the question his makers left behind. Observe and analyze -- not join.", "He crouches to GEAR's level and speaks as a colleague."], "room": "GEAR may roll toward the array to observe. Ismara gets the chance to answer him.", "points": ["Asked about the makers", "'The part that stayed'"], "next": ["hub"]}, "varon": {"g": "person", "title": "Varon", "intent": "The body cut apart and rebuilt to serve.", "aim": "Name the prison. No personal cure promised.", "anchors": [{"t": "They rebuilt you so other people could keep using you.", "src": "DRAFT", "ref": ""}], "info": ["Varon is exactly the prison Gaelen describes (your words).", "His plea to Alfonso was desperation; he knows dealing with Alfonso is dealing with the devil.", "Probably ONLY Saijah can stop him from defecting. Whether she does is her choice."], "room": "His hand goes to the scar behind his ear. Stillness.", "points": ["Named the prison"], "next": ["saijah", "hub"]}, "ylva": {"g": "person", "title": "Ylva", "intent": "Judgment: the Companions cast her out.", "aim": "He argues every structure she served judged her.", "anchors": [{"t": "Every pack you've belonged to had a rule for throwing you out.", "src": "DRAFT", "ref": ""}], "info": ["Ylva REFUTES HIM HERSELF: Alfonso is the one person who never judged her, and Gaelen condemning the whole world is itself a judgment (your words).", "The Companions are not dead -- Jorrvaskr exists; she was kicked out."], "room": "She looks to Alfonso. If he rejects Gaelen, she moves with him.", "points": ["Made the judgment argument"], "next": ["alfonso", "hub"]}, "bjorn": {"g": "person", "title": "Bjorn", "intent": "Mable, Serana, every loss.", "aim": "The promise: he never has to lose anyone again. No one ever will.", "anchors": [{"t": "You'd never have to bury anyone again. No one would.", "src": "DRAFT", "ref": ""}], "info": ["Bjorn resists even if nobody says anything (your words). He protects Mila first.", "The party doesn't know who his late wife was -- don't name her."], "room": "He steps between Mila and the ritual.", "points": ["No-more-loss promise"], "next": ["mila", "hub"]}, "mila": {"g": "person", "title": "Mila", "intent": "Safety, being left behind.", "aim": "No doctrine. Plain words. He doesn't pressure her.", "anchors": [{"t": "No one would leave you behind.", "src": "DRAFT", "ref": ""}], "info": ["Her questions are the rebuttal: \"Does Ma const BEATS = ["A Dawn member tightens a wire around an anchor; the shard gives a low note.", "Black sap moves another inch through a crack in the root.", "Red light reaches farther across the floor.", "One Dawn member takes over another's station.", "Jasper checks the next anchor's alignment.", "The chamber grows warmer; the vibration gets harder to ignore."];
const GROUPS = [["start", "Start"], ["talk", "What the players said"], ["person", "Personal pressure points"], ["exit", "Exits"]];
const CONST = ["He keeps working the ritual while he talks.","He speaks to ONE person at a time, closely -- like asking for a private word.","Short, plain, specific sentences. Earnest, not cryptic, not a villain speech. He believes he is saving Skyrim.","He gives true points their due. He concedes what is real.","He never lies, never threatens, never attacks. If hit, he keeps talking.","'Please' is the word he uses when something matters beyond logic."];
const KEY = "gaelen-director-v1";
let S = {}; try { S = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { S = {}; }
S.v = S.v || {}; S.p = S.p || {}; S.n = S.n || {}; S.b = S.b || []; S.cur = S.cur || "welcome";
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function drawMap(){
  let h = "<div class='flow'><b>Welcome</b>&rarr;<b>What do you do?</b>&rarr;<b>open node</b>&rarr;<b>answer + ritual beat</b>&rarr;<b>back</b></div>";
  for (const [g, label] of GROUPS) {
    h += `<h2>${label}</h2><div class="grid g-${g}">`;
    for (const [id, n] of Object.entries(NODES)) {
      if (n.g !== g) continue;
      const pts = (n.points || []).length;
      const done = (n.points || []).filter((_, i) => S.p[id + ":" + i]).length;
      const ct = pts ? `${done}/${pts} covered` : (S.v[id] ? "visited" : "&nbsp;");
      h += `<button class="node ${id === 'hub' ? 'hub' : ''} ${S.v[id] ? 'visited' : ''} ${S.cur === id ? 'current' : ''}" onclick="go('${id}')">${esc(n.title)}<span class="ct">${ct}</span></button>`;
    }
    h += "</div>";
  }
  document.getElementById("map").innerHTML = h;
  document.getElementById("covered").textContent = Object.keys(S.v).length + " / " + Object.keys(NODES).length + " nodes visited";
  document.getElementById("beats").textContent = "Ritual beats used: " + S.b.length;
}
function go(id){ S.cur = id; S.v[id] = 1; save(); drawMap(); drawPanel(); window.scrollTo({top:0, behavior:"smooth"}); }
function tick(id, i){ const k = id + ":" + i; S.p[k] = !S.p[k]; save(); drawMap(); drawPanel(); }
function beat(i){ if (!S.b.includes(i)) S.b.push(i); else S.b = S.b.filter(x => x !== i); save(); drawMap(); drawPanel(); }
function drawPanel(){
  const id = S.cur, n = NODES[id];
  let h = `<h2>${esc(n.title)}</h2><div class="intent">${esc(n.intent || "")}</div>`;
  if (n.aim) h += `<div class="sec"><h3>Gaelen's aim</h3><div>${esc(n.aim)}</div></div>`;
  if (n.must) h += `<div class="sec"><h3>Must-say / must-do</h3>${n.must.map(x => `<div class="mustbox">${esc(x)}</div>`).join("")}</div>`;
  if (n.anchors) h += `<div class="sec"><h3>How he sounds (voice anchors)</h3>${n.anchors.map(a => `<div class="anchor ${a.src === 'DRAFT' ? 'draft' : ''}"><span class="tag ${a.src === 'DRAFT' ? 'd' : 's'}">${a.src}</span>${esc(a.t)}${a.ref ? `<span class="src">${esc(a.ref)}</span>` : ""}</div>`).join("")}</div>`;
  if (n.info) h += `<div class="sec"><h3>What's true / what he knows</h3><ul>${n.info.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`;
  if (n.perf) h += `<div class="sec"><h3>Performance</h3><ul>${n.perf.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`;
  if (n.replies) h += `<div class="sec"><h3>If they say... &rarr; what he has</h3>${n.replies.map(r => `<div class="reply"><b>"${esc(r.say)}"</b><br>${esc(r.ans)}</div>`).join("")}</div>`;
  if (n.room) h += `<div class="sec"><h3>Room reacts</h3><div>${esc(n.room)}</div></div>`;
  if (id !== "hub") h += `<div class="sec"><h3>Ritual beat (pick one per exchange)</h3>${BEATS.map((b, i) => `<button class="beat ${S.b.includes(i) ? 'used' : ''}" onclick="beat(${i})">${esc(b)}</button>`).join("")}</div>`;
  if (n.points && n.points.length) h += `<div class="sec"><h3>Covered this run</h3>${n.points.map((p, i) => `<label class="check ${S.p[id + ':' + i] ? 'done' : ''}"><input type="checkbox" ${S.p[id + ':' + i] ? 'checked' : ''} onchange="tick('${id}',${i})"><span>${esc(p)}</span></label>`).join("")}</div>`;
  if (id !== "hub") h += `<div class="sec"><h3>Notes: what they actually said</h3><textarea oninput="S.n['${id}']=this.value;save()">${esc(S.n[id] || "")}</textarea></div>`;
  h += `<div class="sec"><h3>Next</h3><div class="nextbtns">${id !== 'hub' ? `<button class="home" onclick="go('hub')">&#8962; What did they do?</button>` : ""}${(n.next || []).map(x => `<button onclick="go('${x}')">${esc(NODES[x].title)}</button>`).join("")}</div></div>`;
  h += `<div class="const"><b>Always:</b> ${CONST.map(esc).join(" &middot; ")}</div>`;
  document.getElementById("panel").innerHTML = h;
}
drawMap(); drawPanel();
</script></body></html>

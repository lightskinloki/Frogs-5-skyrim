<svg viewBox="0 0 600 700" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">

  <!-- Background = rock everywhere -->
  <rect width="600" height="700" fill="#4a4035"/>
  <g stroke="#3a3028" stroke-width="1" opacity="0.35">
    <line x1="0" y1="30" x2="600" y2="30"/>
    <line x1="0" y1="65" x2="600" y2="65"/>
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="135" x2="600" y2="135"/>
    <line x1="0" y1="170" x2="600" y2="170"/>
    <line x1="0" y1="205" x2="600" y2="205"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="275" x2="600" y2="275"/>
    <line x1="0" y1="310" x2="600" y2="310"/>
    <line x1="0" y1="345" x2="600" y2="345"/>
    <line x1="0" y1="380" x2="600" y2="380"/>
    <line x1="0" y1="415" x2="600" y2="415"/>
    <line x1="0" y1="450" x2="600" y2="450"/>
    <line x1="0" y1="485" x2="600" y2="485"/>
    <line x1="0" y1="520" x2="600" y2="520"/>
    <line x1="0" y1="555" x2="600" y2="555"/>
    <line x1="0" y1="590" x2="600" y2="590"/>
    <line x1="0" y1="625" x2="600" y2="625"/>
    <line x1="0" y1="660" x2="600" y2="660"/>
  </g>

  <!-- ══════════════════════════════════════
       TRAVERSABLE SPACE carved out of rock.

       The 7000 Steps run SOUTH to NORTH (bottom to top).
       The gap is a THROUGH-ROUTE, not a dead end.
       The den is a SIDE POCKET off the east side
       of the path, under the deepening overhang.

       Path (the gap):  x=120-310, running full height
       Den (side cave): pocket east of the path,
                         opening at the den mouth
  ══════════════════════════════════════ -->

  <!-- THE STEPS — approaching from south, continuing north -->
  <!-- South approach -->
  <rect x="120" y="560" width="190" height="140" fill="#d8dfe8"/>
  <line x1="120" y1="585" x2="310" y2="585" stroke="#c0c8d4" stroke-width="1.5"/>
  <line x1="120" y1="610" x2="310" y2="610" stroke="#c0c8d4" stroke-width="1.5"/>
  <line x1="120" y1="635" x2="310" y2="635" stroke="#c0c8d4" stroke-width="1.5"/>
  <line x1="120" y1="660" x2="310" y2="660" stroke="#c0c8d4" stroke-width="1.5"/>
  <line x1="120" y1="685" x2="310" y2="685" stroke="#c0c8d4" stroke-width="1.5"/>

  <!-- THE OPEN GAP — wind tunnel, through-route -->
  <!-- Runs from y=100 to y=560 between the rock wall and overhang -->
  <rect x="120" y="100" width="190" height="460" fill="#c8d2de"/>

  <!-- Wind streaks -->
  <g stroke="#b0bcc8" stroke-width="1" opacity="0.45">
    <line x1="125" y1="120" x2="305" y2="128"/>
    <line x1="125" y1="155" x2="305" y2="163"/>
    <line x1="125" y1="190" x2="305" y2="198"/>
    <line x1="125" y1="225" x2="305" y2="233"/>
    <line x1="125" y1="260" x2="305" y2="268"/>
    <line x1="125" y1="295" x2="305" y2="303"/>
    <line x1="125" y1="330" x2="305" y2="338"/>
    <line x1="125" y1="365" x2="305" y2="373"/>
    <line x1="125" y1="400" x2="305" y2="408"/>
    <line x1="125" y1="435" x2="305" y2="443"/>
    <line x1="125" y1="470" x2="305" y2="478"/>
    <line x1="125" y1="505" x2="305" y2="513"/>
    <line x1="125" y1="540" x2="305" y2="548"/>
  </g>

  <!-- North exit — path continues to High Hrothgar -->
  <rect x="120" y="20" width="190" height="80" fill="#d8dfe8"/>
  <line x1="120" y1="40" x2="310" y2="40" stroke="#c0c8d4" stroke-width="1.5"/>
  <line x1="120" y1="60" x2="310" y2="60" stroke="#c0c8d4" stroke-width="1.5"/>
  <line x1="120" y1="80" x2="310" y2="80" stroke="#c0c8d4" stroke-width="1.5"/>

  <!-- ══════════════════════════════════════
       THE DEN — side pocket off the EAST
       side of the path, where the overhang
       deepens into a shallow cave.

       The den mouth opens onto the gap.
       The troll defends the mouth.
       The far (east) wall is Jurgen's door.
  ══════════════════════════════════════ -->

  <!-- Den floor — sheltered, undisturbed snow -->
  <!-- Den: a pocket extending east from the gap, roughly y=180-380 -->
  <!-- Mouth opening at x=310 (east edge of gap), den extends to x=500 -->
  <rect x="310" y="200" width="190" height="170" fill="#e0e6e0"/>

  <!-- Rounded cave back wall (natural, not square) -->
  <!-- Taper the den at north and south edges -->
  <polygon points="310,200 500,220 500,350 310,370" fill="#e0e6e0"/>
  <!-- Cover the square corners with rock to make the cave shape -->
  <polygon points="500,200 500,220 310,200" fill="#4a4035"/>
  <polygon points="500,350 500,370 310,370" fill="#4a4035"/>

  <!-- Undisturbed snow inside den -->
  <ellipse cx="380" cy="265" rx="25" ry="7" fill="#d5ddd5" opacity="0.6"/>
  <ellipse cx="430" cy="300" rx="20" ry="6" fill="#d5ddd5" opacity="0.6"/>
  <ellipse cx="360" cy="330" rx="18" ry="5" fill="#d5ddd5" opacity="0.6"/>

  <!-- JURGEN'S DOOR — the far (east) wall of the den -->
  <line x1="500" y1="220" x2="500" y2="350" stroke="#6b5d4f" stroke-width="8"/>
  <!-- Old carving under sap -->
  <line x1="500" y1="230" x2="500" y2="340" stroke="#2a1e14" stroke-width="3" stroke-dasharray="4,3"/>
  <!-- GM label -->
  <text x="530" y="270" fill="#c0392b" font-size="11" font-weight="bold" transform="rotate(90,530,270)">JURGEN'S DOOR</text>
  <text x="555" y="270" fill="#c0392b" font-size="9" font-style="italic" transform="rotate(90,555,270)">(GM only — omit on player copy)</text>

  <!-- DEN MOUTH label -->
  <line x1="310" y1="200" x2="310" y2="370" stroke="#90b888" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="317" y="192" fill="#90b888" font-size="9" font-weight="bold">DEN MOUTH</text>

  <!-- Overhang edge — dashed line along east side of gap -->
  <!-- Runs the length of the gap EXCEPT where the den mouth opens -->
  <line x1="310" y1="100" x2="310" y2="200" stroke="#7a6e5e" stroke-width="3" stroke-dasharray="12,6"/>
  <line x1="310" y1="370" x2="310" y2="560" stroke="#7a6e5e" stroke-width="3" stroke-dasharray="12,6"/>

  <!-- ══════════════════════════════════════
       EMBLEM IX — at the gap mouth (south)
  ══════════════════════════════════════ -->
  <rect x="284" y="545" width="20" height="28" rx="2" fill="#5a5040" stroke="#9a8060" stroke-width="2"/>
  <rect x="286" y="547" width="16" height="24" rx="1" fill="#1a1206" opacity="0.85"/>
  <text x="294" y="582" text-anchor="middle" fill="#b09050" font-size="10" font-weight="bold">IX</text>

  <!-- ══════════════════════════════════════
       20 FT VISIBILITY RING
  ══════════════════════════════════════ -->
  <!-- gap width 190px ≈ 25ft → 1ft ≈ 7.6px → 20ft ≈ 152px -->
  <circle cx="215" cy="540" r="152" fill="none" stroke="#e8c040" stroke-width="1.8" stroke-dasharray="10,6" opacity="0.5"/>

  <!-- ══════════════════════════════════════
       WIND DIRECTION
  ══════════════════════════════════════ -->
  <g fill="#6090c8" opacity="0.7">
    <text x="190" y="180" font-size="18">↓</text>
    <text x="250" y="220" font-size="18">↓</text>
    <text x="170" y="270" font-size="16">↓</text>
    <text x="240" y="320" font-size="16">↓</text>
    <text x="200" y="380" font-size="14">↓</text>
    <text x="260" y="440" font-size="14">↓</text>
    <text x="180" y="500" font-size="14">↓</text>
  </g>

  <!-- ══════════════════════════════════════
       LABELS
  ══════════════════════════════════════ -->

  <!-- West wall -->
  <text x="60" y="350" text-anchor="middle" fill="#8a7e6e" font-size="12" font-weight="bold" transform="rotate(-90,60,350)">ROCK WALL (west, sheer)</text>

  <!-- East overhang (above and below den) -->
  <text x="380" y="155" fill="#8a7e6e" font-size="10" font-style="italic">overhang (above)</text>
  <text x="380" y="420" fill="#8a7e6e" font-size="10" font-style="italic">overhang (above)</text>

  <!-- Gap label -->
  <rect x="130" y="400" width="170" height="52" rx="4" fill="#1a1a1a" opacity="0.6"/>
  <text x="215" y="420" text-anchor="middle" fill="#d0d8e4" font-size="12" font-weight="bold">OPEN GAP</text>
  <text x="215" y="434" text-anchor="middle" fill="#a0aab8" font-size="10">4-5 abreast | WIND ↓</text>
  <text x="215" y="448" text-anchor="middle" fill="#c87030" font-size="9">burns last 1/2 duration</text>

  <!-- Den label -->
  <rect x="340" y="255" width="140" height="52" rx="4" fill="#1a1a1a" opacity="0.65"/>
  <text x="410" y="273" text-anchor="middle" fill="#c8e4c0" font-size="12" font-weight="bold">THE DEN</text>
  <text x="410" y="287" text-anchor="middle" fill="#90b888" font-size="10">sheltered | no wind</text>
  <text x="410" y="301" text-anchor="middle" fill="#60b040" font-size="9">burns FULL duration</text>

  <!-- North exit -->
  <text x="215" y="35" text-anchor="middle" fill="#8090a8" font-size="10" font-style="italic">→ continues to High Hrothgar</text>

  <!-- South approach -->
  <text x="215" y="695" text-anchor="middle" fill="#8090a8" font-size="10" font-style="italic">↑ party approaches from Steps below</text>

  <!-- 20ft label -->
  <text x="68" y="490" fill="#c8a030" font-size="10" font-style="italic" text-anchor="end">20 ft visibility</text>
  <line x1="72" y1="488" x2="105" y2="480" stroke="#c8a030" stroke-width="1"/>

  <!-- Gap width callout -->
  <line x1="120" y1="650" x2="310" y2="650" stroke="#d0c090" stroke-width="1.5"/>
  <line x1="120" y1="644" x2="120" y2="656" stroke="#d0c090" stroke-width="1.5"/>
  <line x1="310" y1="644" x2="310" y2="656" stroke="#d0c090" stroke-width="1.5"/>
  <text x="215" y="668" text-anchor="middle" fill="#d0c090" font-size="10">4-5 abreast</text>

  <!-- ══════════════════════════════════════
       TROLL START POSITION (GM reference)
  ══════════════════════════════════════ -->
  <text x="330" y="240" fill="#aa4444" font-size="16">T</text>
  <text x="348" y="236" fill="#884040" font-size="8">troll</text>
  <text x="348" y="246" fill="#884040" font-size="8">starts</text>

  <!-- ══════════════════════════════════════
       COMPASS
  ══════════════════════════════════════ -->
  <g transform="translate(555,630)">
    <circle r="22" fill="#2a2218" stroke="#555" stroke-width="1.5"/>
    <polygon points="0,-16 -5,8 0,4 5,8" fill="#d0d0d0"/>
    <polygon points="0,16 -5,-8 0,-4 5,-8" fill="#555"/>
    <text x="0" y="-19" text-anchor="middle" fill="#d0d0d0" font-size="10" font-weight="bold">N</text>
    <text x="0" y="26" text-anchor="middle" fill="#666" font-size="9">uphill</text>
  </g>

  <!-- ══════════════════════════════════════
       TITLE BAR
  ══════════════════════════════════════ -->
  <rect x="0" y="700" width="600" height="0" fill="none"/>

</svg>
